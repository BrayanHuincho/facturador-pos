name: facturador_pos
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  connectivity_plus: ^7.3.2
  decimal: ^3.2.6
  dio: ^5.11.1
  esc_pos_utils_plus: ^2.0.4
  file_picker: ^13.3.2
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.2
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  print_bluetooth_thermal: ^1.2.5
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/marcas/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
